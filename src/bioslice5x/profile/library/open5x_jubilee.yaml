# Open5X Jubilee Toolchanger chassis — B + C kinematic configuration.
#
# Reference: `3D_Model/Jubilee Tool changer/README.md` in the upstream
# Open5X repo, which is the most explicit text about axis-letter
# conventions in the project:
#
#   "A axis would rotate around the X-axis by convention;
#    B axis rotates around the Y-axis by convention;
#    C axis rotates around the Z-axis by convention."
#
# The Jubilee chassis physically tilts about world Y (the tilt yoke
# pivots in the YZ plane), so by ISO 841 the tilt joint maps to G-code
# letter B. The plate rotates about world Z, so the swivel joint maps
# to letter C — same as Prusa.
#
# Build volume here is conservative: the Jubilee README does not pin
# an exact volume in mm; the documented carriage uses a 235 mm bed at
# minimum, but the rotary fixture eats some of that. Treat the values
# below as a starting point and tighten per the operator's specific
# build. Tilt range is the same ±200° "intentional overrange" the
# Prusa Open5X uses.
#
# Firmware target: RepRapFirmware 3.2-beta+ on a Duet 3 mainboard,
# per the Jubilee README's hardware notes.

name: open5x_jubilee
firmware: rrf

build_volume:
  x_mm: [-115.0, 115.0]
  y_mm: [-115.0, 115.0]
  z_mm: [-1.0, 200.0]

kinematic_chain:
  kind: tilt_swivel
  tilt:
    rotates_about: y
    letter: B
    invert: false
    range_deg: [-200.0, 200.0]
    max_feed_deg_per_min: 5000.0
  swivel:
    rotates_about: z
    letter: C
    invert: false
    # Same slewing-ring effective-unbounded plate as the other chassis.
    range_deg: [-360000.0, 360000.0]
    max_feed_deg_per_min: 12000.0

max_xy_feed_mm_per_min: 12000.0
max_z_feed_mm_per_min: 750.0
max_e_feed_uL_per_min: 50.0
has_heated_bed: false

notes: "5-axis Jubilee Toolchanger conversion. Tilt-about-Y (letter B) per ISO 841 and the Jubilee README explicit axis-convention statement."
