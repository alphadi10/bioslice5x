[project]
name = "bioslice5x"
version = "0.1.0"
description = "Open-source 5-axis slicer for syringe-based bioprinting (FRESH/CHIPS workflows)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BioSlice5X contributors" }]
maintainers = [{ name = "BioSlice5X maintainers" }]
keywords = [
    "bioprinting",
    "5-axis",
    "slicer",
    "fresh",
    "chips",
    "g-code",
    "reprapfirmware",
    "tissue-engineering",
    "syringe-extrusion",
    "open5x",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "trimesh>=4.0",
    # trimesh uses networkx internally for mesh-section graph traversal
    # (trimesh.path.traversal.vertex_graph). It's marked optional upstream
    # but every flat_slice / wrap_around_axis_slice call hits the path,
    # so we pin it explicitly here. Without this, trimesh's lazy import
    # raises ModuleNotFoundError on the first slice.
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
viz = ["pyvista>=0.43"]
gui = []  # Tkinter is stdlib — no extra deps; the extra exists for visibility.

[project.scripts]
bioslice5x = "bioslice5x.cli:main"
bioslice5x-gui = "bioslice5x.gui:main"

[project.urls]
Homepage = "https://github.com/bioslice5x/bioslice5x"
Documentation = "https://github.com/bioslice5x/bioslice5x#readme"
Repository = "https://github.com/bioslice5x/bioslice5x"
Issues = "https://github.com/bioslice5x/bioslice5x/issues"
Changelog = "https://github.com/bioslice5x/bioslice5x/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioslice5x"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "bioslice5x/_schemas"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "schemas",
    "samples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LIMITATIONS.md",
    "ARCHITECTURE.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "import-linter>=2.0",
]

# ----- import-linter contracts -----
# Enforce the module layering documented in CONTRIBUTING.md. Lower layers
# must not import higher layers; cross-cuts go through structural Protocols.
[tool.importlinter]
root_package = "bioslice5x"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "bioslice5x.cli | bioslice5x.slicer",
    "bioslice5x.postprocessor",
    "bioslice5x.extruder | bioslice5x.pathing | bioslice5x.recipe.orientation",
    # recipe.orientation is at layer 3 above; the parent `bioslice5x.recipe`
    # can't appear here without "shared descendants" — list its other
    # submodules explicitly instead.
    "bioslice5x.bath | bioslice5x.profile | bioslice5x.recipe.models | bioslice5x.recipe.loader | bioslice5x.geometry | bioslice5x.kinematics.chain | bioslice5x.kinematics.singularity",
    "bioslice5x.bioink | bioslice5x.errors | bioslice5x.kinematics.canonical",
]
ignore_imports = [
    # The bath protocol uses Point3DLike (a structural Protocol) instead
    # of importing pathing types — but pathing's bath-aware travel helper
    # legitimately consumes BathSurface. That's the correct direction.
]

[[tool.importlinter.contracts]]
name = "bath does not import pathing"
type = "forbidden"
source_modules = ["bioslice5x.bath"]
forbidden_modules = ["bioslice5x.pathing"]

[[tool.importlinter.contracts]]
name = "recipe does not import postprocessor"
type = "forbidden"
source_modules = ["bioslice5x.recipe"]
forbidden_modules = ["bioslice5x.postprocessor", "bioslice5x.slicer", "bioslice5x.cli"]

[[tool.importlinter.contracts]]
name = "geometry does not import slicer/postprocessor"
type = "forbidden"
source_modules = ["bioslice5x.geometry"]
forbidden_modules = ["bioslice5x.slicer", "bioslice5x.postprocessor", "bioslice5x.cli"]

[[tool.importlinter.contracts]]
name = "kinematics is letter-free (no postprocessor)"
type = "forbidden"
source_modules = ["bioslice5x.kinematics"]
forbidden_modules = ["bioslice5x.postprocessor", "bioslice5x.cli"]

# ----- ruff -----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "C4",            # comprehensions
    "PT",            # pytest style
    "RET",           # return statements
    "TID",           # tidy imports
]
ignore = [
    "E501",   # line length handled by formatter
    # Scientific code uses unit suffixes (uL, mL, mm, kPa, Pa·s). PEP 8's
    # mixed-case warning fires on these; we want them readable, not snake-case.
    "N803",   # argument name mixed-case (e.g. volume_uL)
    "N806",   # variable name mixed-case
    "N815",   # class attribute name mixed-case
    # Greek letters and en-dashes appear in physics docstrings; ASCII
    # substitution loses meaning.
    "RUF001", # ambiguous Unicode in strings (γ, μ, τ used as math symbols)
    "RUF002", # ambiguous Unicode in docstrings (en-dash for ranges, –, →)
    "RUF003", # ambiguous Unicode in comments
    "N802",   # function name mixed-case — unit suffixes again
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "PT011"]

# ----- mypy -----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
no_implicit_reexport = true
files = ["src/bioslice5x", "tests"]

[[tool.mypy.overrides]]
module = [
    "trimesh",
    "trimesh.*",
    "scipy",
    "scipy.*",
    "pyvista",
    "pyvista.*",
    "shapely",
    "shapely.*",
]
ignore_missing_imports = true

# Tkinter's typeshed stubs don't accept `**kwargs: int` patterns well
# (e.g., `**pad` where pad = {"padx": 8, "pady": 4}). The GUI is mostly
# Tk-widget glue; we relax strictness here rather than litter the code
# with type-ignores. Behaviour is covered by `tests/test_gui_smoke.py`.
[[tool.mypy.overrides]]
module = ["bioslice5x.gui"]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["arg-type", "no-untyped-call"]

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["src"]
