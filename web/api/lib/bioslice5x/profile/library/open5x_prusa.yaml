# Open5X Prusa i3 chassis — A+C kinematic configuration.
#
# Letter mapping at the postprocessor:
#   tilt joint  → letter A, rotates about world X (Open5X Version_Save convention).
#   swivel joint → letter C, rotates about world Z.
#
# Sign convention: right-hand rule (INFERRED from Open5X's M569 "anti-clockwise"
# comments — see docs/OPEN5X_NOTES.md §2 VERIFY AT COMMISSIONING). If hardware
# commissioning reveals an inverted sign, flip the `invert` flag on the
# affected axis here — no kinematics code needs to change.
#
# Build volume from Duet2_Configuration/sys/config.g (line M208), tilt range
# from M208 A-200:200 (Prusa-specific intentional overrange).

name: open5x_prusa
firmware: rrf

build_volume:
  x_mm: [-126.0, 125.0]
  y_mm: [-92.3, 50.0]
  z_mm: [-1.0, 125.0]

kinematic_chain:
  kind: tilt_swivel
  tilt:
    rotates_about: x
    letter: A
    invert: false
    range_deg: [-200.0, 200.0]
    max_feed_deg_per_min: 5000.0
  swivel:
    rotates_about: z
    letter: C
    invert: false
    # Open5X plate is mechanically unbounded (slewing ring); pick a generous
    # default. Operators can tighten this per their hardware.
    range_deg: [-360000.0, 360000.0]
    max_feed_deg_per_min: 12000.0

max_xy_feed_mm_per_min: 12000.0
max_z_feed_mm_per_min: 750.0
max_e_feed_uL_per_min: 50.0
has_heated_bed: false

notes: "Default 5-axis profile. Adopts Open5X's original Prusa Version_Save A+C letter convention."
