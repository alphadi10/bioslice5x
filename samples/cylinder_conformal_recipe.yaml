# Sample recipe: 5 mm radius × 10 mm tall cylinder printed in conformal
# wrap-around-Z mode on the Open5X Prusa profile. Used in
# docs/tutorial/quickstart.md.
#
# Calibration status: all values are uncalibrated literature defaults.

name: cylinder_conformal_demo

syringes:
  - id: 0
    bioink: collagen_i_8mg_per_mL
    cell_payload: general_mammalian
    needle:
      inner_diameter_mm: 0.84
      length_mm: 12.7
      gauge_label: "18G"

slicing:
  layer_height_mm: 0.4
  line_width_mm: 0.5
  print_speed_mm_per_min: 60.0
  mode:
    kind: wrap_around_axis
    wrap_axis: z
    cylinder_radius_mm: 5.0
    arc_start_deg: -180.0
    arc_end_deg: 180.0
