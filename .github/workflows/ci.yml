name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install xvfb + OpenGL libs for headless PyVista
        # PyVista's screenshot smoke tests call into VTK's OpenGL renderer.
        # Without an X server + mesa-utils the C-level context creation
        # segfaults — which Python can't catch, so per-test try/except
        # blocks don't help. tests/conftest.py calls `pyvista.start_xvfb()`
        # and falls back to skipping the rendering tests if xvfb isn't
        # available; this step keeps it available on the CI runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libosmesa6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Import-linter (module dependency contracts)
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest -v

      - name: Regenerate JSON schemas (must be a no-op)
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code schemas/
